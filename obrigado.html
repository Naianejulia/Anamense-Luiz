<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado!</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#000,#1a1a1a);
      color:#fff;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px
    }
    .box{
      max-width:500px;
      background:#111;
      padding:50px 30px;
      border-radius:24px;
      box-shadow:0 8px 32px rgba(0,0,0,.6)
    }
    h1{font-size:2rem;margin-bottom:15px}
    p{color:#ccc;margin-bottom:30px}
    a{
      display:inline-block;
      padding:14px 36px;
      background:#fff;
      color:#000;
      border-radius:50px;
      text-decoration:none;
      font-weight:600
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Obrigado!</h1>
    <p>Sua ficha de anamnese foi enviada com sucesso.<br>
    Em breve entraremos em contato.</p>
    <a href="index.html">Nova Anamnese</a>
  </div>
</body>
</html>
